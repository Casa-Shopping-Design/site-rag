# Verificacoes de todo push e pull request. Nenhum segredo entra aqui: o build
# usa valores falsos e o banco sobe local pela CLI do Supabase.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site (lint, tipos, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Valores falsos de proposito. O build nao pode depender de chave real.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: chave-falsa-ci
      OPENAI_API_KEY: chave-falsa-ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npx eslint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build
        run: npx next build

      - name: Testes do site
        run: npm run teste --if-present

  banco:
    name: Banco (migrations e testes pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # O supabase/config.toml sai do "supabase init" e precisa estar commitado.
      # Sem ele a CLI nao sobe o banco, entao o job para com um aviso claro.
      - name: Conferir supabase/config.toml
        run: |
          if [ ! -f supabase/config.toml ]; then
            echo "::error file=supabase/config.toml::Falta o supabase/config.toml. Rode 'supabase init' e commite o arquivo."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Sobe o Postgres local e aplica as migrations e o seed.
      - name: Subir banco local
        run: supabase db start

      # Inclui os quatro testes obrigatorios de isolamento (supabase/tests).
      - name: Testes de RLS e visibilidade
        run: supabase test db

      - name: Derrubar banco
        if: always()
        run: supabase stop --no-backup

  ingestao:
    name: Ingestao (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ingestao
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ingestao/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pyflakes

      - name: Ruff
        run: ruff check .

      - name: Pyflakes
        run: pyflakes .

      # Confere que o script importa a rag-ingestao na versao fixada. Nao toca em banco.
      - name: Script abre sem erro
        run: python enviar.py --help
